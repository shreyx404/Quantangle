<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#060912" />
    </radialGradient>
    <linearGradient id="quantumRing1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="quantumRing2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="coreGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Plate with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="510" height="510" x="1" y="1" rx="111" fill="none" stroke="#1e293b" stroke-width="2" />

  <!-- Subtle Coordinate Grid Background -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.6" />
  <circle cx="256" cy="256" r="120" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.4" />
  <line x1="76" y1="256" x2="436" y2="256" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="3 5" opacity="0.5" />
  <line x1="256" y1="76" x2="256" y2="436" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="3 5" opacity="0.5" />

  <!-- Quantum Orbital Rings (Entangled States) -->
  <g transform="translate(256, 256)">
    <!-- Ring 1 (Cyan-Blue) -->
    <ellipse cx="0" cy="0" rx="190" ry="72" transform="rotate(-30)" fill="none" stroke="url(#quantumRing1)" stroke-width="5" filter="url(#glow)" opacity="0.9" />
    <!-- Ring 2 (Amber-Magenta) -->
    <ellipse cx="0" cy="0" rx="190" ry="72" transform="rotate(30)" fill="none" stroke="url(#quantumRing2)" stroke-width="4" filter="url(#glow)" opacity="0.8" />
    <!-- Ring 3 (Equatorial) -->
    <ellipse cx="0" cy="0" rx="195" ry="50" transform="rotate(90)" fill="none" stroke="#06b6d4" stroke-width="3" stroke-dasharray="8 6" opacity="0.5" />

    <!-- Orbital Nodes (Qubits |q₀⟩, |q₁⟩) -->
    <!-- Node on Ring 1 -->
    <g transform="rotate(-30)">
      <circle cx="160" cy="38" r="10" fill="#38bdf8" filter="url(#glow)" />
      <circle cx="160" cy="38" r="5" fill="#ffffff" />
      <circle cx="-160" cy="-38" r="8" fill="#818cf8" filter="url(#glow)" />
      <circle cx="-160" cy="-38" r="4" fill="#ffffff" />
    </g>

    <!-- Node on Ring 2 -->
    <g transform="rotate(30)">
      <circle cx="-150" cy="42" r="9" fill="#fbbf24" filter="url(#glow)" />
      <circle cx="-150" cy="42" r="4.5" fill="#ffffff" />
    </g>

    <!-- Superconducting Quantum Core / Bloch Center -->
    <circle cx="0" cy="0" r="32" fill="#0369a1" filter="url(#coreGlow)" opacity="0.6" />
    <circle cx="0" cy="0" r="22" fill="#082f49" stroke="#06b6d4" stroke-width="3" />
    <circle cx="0" cy="0" r="10" fill="#38bdf8" filter="url(#glow)" />
    <circle cx="0" cy="0" r="5" fill="#ffffff" />

    <!-- Quantum Dirac Notation |Ψ⟩ Center Silhouette -->
    <path d="M -12 -12 L 0 -18 L 12 -12 L 0 18 Z" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.7" />
  </g>

  <!-- Outer Telemetry Label -->
  <text x="256" y="475" text-anchor="middle" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="20" letter-spacing="4">QUANTANGLE</text>
</svg>
