  <!-- Callout lines pointing to sides -->
  <!-- Left Side -->
  <line x1="65" y1="210" x2="25" y2="210" stroke="#94A3B8" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="25" y="200" fill="#64748B" font-family="system-ui" font-size="8" font-weight="600" text-anchor="start">Wide Funnel</text>

  <!-- Right Side -->
