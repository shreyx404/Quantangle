<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 380" width="100%" height="100%">
  <!-- Transparent background for seamless slide integration -->
  
  <!-- Central Bloch Sphere -->
  <g transform="translate(160, 150)">
    <circle cx="0" cy="0" r="100" fill="#F8FAFC" stroke="#0F172A" stroke-width="1.5"/>
    <ellipse cx="0" cy="0" rx="100" ry="30" fill="none" stroke="#64748B" stroke-width="1" stroke-dasharray="3,3"/>
    <ellipse cx="0" cy="0" rx="30" ry="100" fill="none" stroke="#94A3B8" stroke-width="1" stroke-dasharray="2,2"/>
    
    <!-- Z Axis -->
    <line x1="0" y1="-125" x2="0" y2="125" stroke="#334155" stroke-width="1.2"/>
    <polygon points="0,-130 -3,-122 3,-122" fill="#334155"/>
    <polygon points="0,130 -3,122 3,122" fill="#334155"/>
    <line x1="-120" y1="0" x2="120" y2="0" stroke="#CBD5E1" stroke-width="1"/>
    
    <!-- Labels -->
    <text x="0" y="-138" fill="#0F172A" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">|0⟩</text>
    <text x="0" y="148" fill="#0F172A" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">|1⟩</text>

    <!-- State Vector -->
    <line x1="0" y1="0" x2="60" y2="-60" stroke="#4F46E5" stroke-width="2.5"/>
    <circle cx="60" cy="-60" r="3.5" fill="#4F46E5"/>
    <text x="70" y="-65" fill="#4338CA" font-family="system-ui, monospace" font-size="11" font-weight="600">|ψ⟩</text>
  </g>

  <!-- Floating Minimal Gate Pills -->
  <g transform="translate(40, 60)">
    <rect width="32" height="32" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <text x="16" y="21" fill="#0F172A" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">H</text>
  </g>
  <g transform="translate(240, 80)">
    <rect width="32" height="32" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <text x="16" y="21" fill="#0F172A" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">CX</text>
  </g>

  <!-- Compact Circuit Schematic -->
  <g transform="translate(20, 300)">
    <rect width="280" height="60" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    
    <!-- Wires -->
    <text x="12" y="24" fill="#475569" font-family="monospace" font-size="10">q[0]</text>
    <line x1="40" y1="20" x2="260" y2="20" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="12" y="44" fill="#475569" font-family="monospace" font-size="10">q[1]</text>
    <line x1="40" y1="40" x2="260" y2="40" stroke="#CBD5E1" stroke-width="1.5"/>

    <!-- Gates -->
    <rect x="60" y="10" width="20" height="20" rx="4" fill="#F8FAFC" stroke="#0F172A" stroke-width="1.2"/>
    <text x="70" y="24" fill="#0F172A" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">H</text>

    <circle cx="120" cy="20" r="3" fill="#0F172A"/>
    <line x1="120" y1="20" x2="120" y2="40" stroke="#0F172A" stroke-width="1.5"/>
    <circle cx="120" cy="40" r="6" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.2"/>
    <line x1="114" y1="40" x2="126" y2="40" stroke="#0F172A" stroke-width="1.2"/>

    <rect x="160" y="30" width="30" height="20" rx="4" fill="#F8FAFC" stroke="#0F172A" stroke-width="1.2"/>
    <text x="175" y="44" fill="#0F172A" font-family="system-ui, sans-serif" font-size="9" font-weight="700" text-anchor="middle">Rz</text>

    <!-- Measure -->
    <rect x="220" y="10" width="20" height="20" rx="4" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.2"/>
    <text x="230" y="24" fill="#4F46E5" font-family="system-ui, sans-serif" font-size="9" font-weight="700" text-anchor="middle">M</text>
  </g>
</svg>
