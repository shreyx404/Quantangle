<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" width="100%" height="100%">
  <!-- Transparent background for seamless slide integration -->

  <!-- Client Layer -->
  <rect x="50" y="20" width="400" height="40" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="250" y="44" fill="#0F172A" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">FRONTEND (Next.js 14 / React / Three.js)</text>

  <!-- Arrow -->
  <line x1="250" y1="60" x2="250" y2="80" stroke="#94A3B8" stroke-width="1.5"/>
  <polygon points="250,85 246,77 254,77" fill="#94A3B8"/>

  <!-- AST Layer -->
  <rect x="50" y="85" width="400" height="40" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="250" y="109" fill="#0F172A" font-family="system-ui, monospace" font-size="11" font-weight="600" text-anchor="middle">AST Engine ⇄ OpenQASM 3.0 Transpiler</text>

  <!-- Split Arrow -->
  <path d="M 250,125 L 250,145 L 140,145 L 140,165" stroke="#94A3B8" stroke-width="1.5" fill="none"/>
  <polygon points="140,170 136,162 144,162" fill="#94A3B8"/>
  <text x="140" y="140" fill="#059669" font-family="system-ui" font-size="9" font-weight="700" text-anchor="end">≤16 Qubits  </text>

  <path d="M 250,125 L 250,145 L 360,145 L 360,165" stroke="#94A3B8" stroke-width="1.5" fill="none"/>
  <polygon points="360,170 356,162 364,162" fill="#94A3B8"/>
  <text x="360" y="140" fill="#4F46E5" font-family="system-ui" font-size="9" font-weight="700" text-anchor="start">  &gt;16 Qubits / VQE</text>

  <!-- Edge Sim Box -->
  <rect x="50" y="170" width="180" height="50" rx="6" fill="#FFFFFF" stroke="#059669" stroke-width="1.5"/>
  <text x="140" y="190" fill="#059669" font-family="system-ui" font-size="11" font-weight="700" text-anchor="middle">EDGE WASM (Client)</text>
  <text x="140" y="206" fill="#475569" font-family="system-ui" font-size="9" text-anchor="middle">0ms Latency • Offline</text>

  <!-- Cloud Box -->
  <rect x="270" y="170" width="180" height="50" rx="6" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
  <text x="360" y="190" fill="#4338CA" font-family="system-ui" font-size="11" font-weight="700" text-anchor="middle">CLOUD (FastAPI)</text>
  <text x="360" y="206" fill="#475569" font-family="system-ui" font-size="9" text-anchor="middle">Qiskit / Cirq / PennyLane</text>

  <!-- DB Box under Cloud -->
  <line x1="360" y1="220" x2="360" y2="235" stroke="#94A3B8" stroke-width="1.5"/>
  <rect x="270" y="235" width="180" height="25" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
  <text x="360" y="252" fill="#475569" font-family="system-ui" font-size="9" font-weight="600" text-anchor="middle">PostgreSQL + Celery/Redis</text>

  <!-- Connecting to AI Core from Edge -->
  <line x1="140" y1="220" x2="140" y2="260" stroke="#94A3B8" stroke-width="1.5"/>
  <line x1="140" y1="260" x2="250" y2="260" stroke="#94A3B8" stroke-width="1.5"/>
  <polygon points="250,265 246,257 254,257" fill="#94A3B8"/>
  
  <!-- Connecting to AI Core from Cloud/DB -->
  <line x1="360" y1="260" x2="360" y2="270" stroke="#94A3B8" stroke-width="1.5"/>
  <line x1="360" y1="270" x2="250" y2="270" stroke="#94A3B8" stroke-width="1.5"/>
  <polygon points="250,265 246,273 254,273" fill="#94A3B8"/>

  <!-- AI Evaluation Box -->
  <rect x="50" y="265" width="400" height="40" rx="6" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.5"/>
  <text x="250" y="289" fill="#0F172A" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Qu-Copilot (RAG) &amp; Fidelity Auto-Grader</text>
</svg>
