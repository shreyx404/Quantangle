<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" width="100%" height="100%">
  <!-- Transparent background -->
  
  <text x="250" y="25" fill="#0F172A" font-family="system-ui" font-size="14" font-weight="700" text-anchor="middle">Quantangle Value Proposition</text>

  <!-- Venn Diagram -->
  <g transform="translate(250, 180)">
    
    <!-- Top Circle: Effective (Education) -->
    <circle cx="0" cy="-60" r="80" fill="#EEF2FF" fill-opacity="0.8" stroke="#4F46E5" stroke-width="2"/>
    <text x="0" y="-105" fill="#4F46E5" font-family="system-ui" font-size="11" font-weight="700" text-anchor="middle">Highly Effective</text>
    <text x="0" y="-93" fill="#4338CA" font-family="system-ui" font-size="8" text-anchor="middle">4x Completion Rate</text>
    <text x="0" y="-83" fill="#4338CA" font-family="system-ui" font-size="8" text-anchor="middle">Active 3D Learning</text>
    
    <!-- Bottom Left Circle: Accessible (Inclusive) -->
    <circle cx="-50" cy="25" r="80" fill="#FFFBEB" fill-opacity="0.8" stroke="#D97706" stroke-width="2"/>
    <text x="-75" y="30" fill="#D97706" font-family="system-ui" font-size="11" font-weight="700" text-anchor="middle">Accessible</text>
    <text x="-75" y="42" fill="#B45309" font-family="system-ui" font-size="8" text-anchor="middle">12+ Languages</text>
    <text x="-75" y="52" fill="#B45309" font-family="system-ui" font-size="8" text-anchor="middle">Offline PWA</text>

    <!-- Bottom Right Circle: Scalable (National/Environmental) -->
    <circle cx="50" cy="25" r="80" fill="#ECFDF5" fill-opacity="0.8" stroke="#10B981" stroke-width="2"/>
    <text x="75" y="30" fill="#059669" font-family="system-ui" font-size="11" font-weight="700" text-anchor="middle">Scalable</text>
    <text x="75" y="42" fill="#047857" font-family="system-ui" font-size="8" text-anchor="middle">Zero-Cost WASM</text>
    <text x="75" y="52" fill="#047857" font-family="system-ui" font-size="8" text-anchor="middle">Green Computing</text>

    <!-- Center Intersection (National Mission) -->
    <text x="0" y="-15" fill="#0F172A" font-family="system-ui" font-size="11" font-weight="800" text-anchor="middle">National</text>
    <text x="0" y="-3" fill="#0F172A" font-family="system-ui" font-size="11" font-weight="800" text-anchor="middle">Quantum Mission</text>
    <text x="0" y="8" fill="#334155" font-family="system-ui" font-size="8" font-weight="600" text-anchor="middle">(25k Engineers)</text>

  </g>
</svg>
