<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 280" width="100%" height="100%">
  <!-- Transparent background -->

  <text x="250" y="20" fill="#0F172A" font-family="system-ui" font-size="12" font-weight="700" text-anchor="middle">Status Quo vs. Quantangle AI</text>

  <!-- VS Divider -->
  <line x1="250" y1="40" x2="250" y2="260" stroke="#E2E8F0" stroke-width="2" stroke-dasharray="4,4"/>
  <circle cx="250" cy="150" r="15" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
  <text x="250" y="154" fill="#94A3B8" font-family="system-ui" font-size="10" font-weight="800" text-anchor="middle">VS</text>

  <!-- Left Side: Status Quo (Redish) -->
  <text x="125" y="50" fill="#EF4444" font-family="system-ui" font-size="11" font-weight="700" text-anchor="middle">Current Quantum Ed.</text>

  <rect x="30" y="70" width="190" height="40" rx="4" fill="#FEF2F2" stroke="#FECACA" stroke-width="1"/>
  <text x="125" y="88" fill="#B91C1C" font-family="system-ui" font-size="9" font-weight="700" text-anchor="middle">Math-Heavy &amp; Abstract</text>
  <text x="125" y="100" fill="#EF4444" font-family="system-ui" font-size="8" text-anchor="middle">Leads to 90% learner drop-off</text>

  <rect x="30" y="125" width="190" height="40" rx="4" fill="#FEF2F2" stroke="#FECACA" stroke-width="1"/>
  <text x="125" y="143" fill="#B91C1C" font-family="system-ui" font-size="9" font-weight="700" text-anchor="middle">High Infrastructure Barrier</text>
  <text x="125" y="155" fill="#EF4444" font-family="system-ui" font-size="8" text-anchor="middle">Requires python setup &amp; cloud</text>

  <rect x="30" y="180" width="190" height="40" rx="4" fill="#FEF2F2" stroke="#FECACA" stroke-width="1"/>
  <text x="125" y="198" fill="#B91C1C" font-family="system-ui" font-size="9" font-weight="700" text-anchor="middle">Language Restricted</text>
  <text x="125" y="210" fill="#EF4444" font-family="system-ui" font-size="8" text-anchor="middle">English-only resources</text>

  <!-- Right Side: Quantangle (Greenish/Blueish) -->
  <text x="375" y="50" fill="#10B981" font-family="system-ui" font-size="11" font-weight="700" text-anchor="middle">With Quantangle</text>

  <rect x="280" y="70" width="190" height="40" rx="4" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1"/>
  <text x="375" y="88" fill="#047857" font-family="system-ui" font-size="9" font-weight="700" text-anchor="middle">Visual &amp; Interactive</text>
  <text x="375" y="100" fill="#059669" font-family="system-ui" font-size="8" text-anchor="middle">Real-time 3D Bloch sphere renders</text>

  <rect x="280" y="125" width="190" height="40" rx="4" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1"/>
  <text x="375" y="143" fill="#047857" font-family="system-ui" font-size="9" font-weight="700" text-anchor="middle">Zero Setup &amp; Offline PWA</text>
  <text x="375" y="155" fill="#059669" font-family="system-ui" font-size="8" text-anchor="middle">Runs instantly via WASM locally</text>

  <rect x="280" y="180" width="190" height="40" rx="4" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1"/>
  <text x="375" y="198" fill="#047857" font-family="system-ui" font-size="9" font-weight="700" text-anchor="middle">Inclusive &amp; Multilingual</text>
  <text x="375" y="210" fill="#059669" font-family="system-ui" font-size="8" text-anchor="middle">12+ Regional languages via Bhashini</text>

</svg>
