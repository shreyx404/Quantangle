  <text x="250" y="230" fill="#4F46E5" font-family="system-ui" font-size="9" font-weight="600" text-anchor="middle">Mass adoption via ₹0 WASM execution</text>

  <!-- Level 2: Institutional -->
  <path d="M 100,170 L 400,170 L 360,110 L 140,110 Z" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.5"/>
