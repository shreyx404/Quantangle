[package]
name = "quantangle-wasm-engine"
version = "1.0.0"
edition = "2021"
description = "Client-side quantum statevector simulator compiled to WebAssembly"
authors = ["Quantangle Team"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2.92"
num-complex = "0.4.4"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6.5"
serde_json = "1.0"
js-sys = "0.3.69"
web-sys = { version = "0.3.69", features = ["console"] }

[dev-dependencies]
wasm-bindgen-test = "0.3.42"

[profile.release]
opt-level = 3
lto = true
