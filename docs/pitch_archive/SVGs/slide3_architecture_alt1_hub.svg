<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" width="100%" height="100%">
  <!-- Hub and Spoke Architecture -->

  <!-- Central Hub -->
  <g transform="translate(250, 160)">
    <circle cx="0" cy="0" r="50" fill="#F8FAFC" stroke="#0F172A" stroke-width="2"/>
    <text x="0" y="-5" fill="#0F172A" font-family="system-ui" font-size="12" font-weight="800" text-anchor="middle">AST</text>
    <text x="0" y="10" fill="#0F172A" font-family="system-ui" font-size="10" font-weight="700" text-anchor="middle">ROUTER</text>
    <text x="0" y="25" fill="#64748B" font-family="system-ui" font-size="8" text-anchor="middle">OpenQASM 3.0</text>
  </g>

  <!-- Connectors -->
  <line x1="250" y1="110" x2="250" y2="70" stroke="#94A3B8" stroke-width="2"/>
  <line x1="250" y1="210" x2="250" y2="250" stroke="#94A3B8" stroke-width="2"/>
  <line x1="200" y1="160" x2="160" y2="160" stroke="#94A3B8" stroke-width="2"/>
  <line x1="300" y1="160" x2="340" y2="160" stroke="#94A3B8" stroke-width="2"/>

  <!-- Top Node: Frontend -->
  <rect x="175" y="30" width="150" height="40" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
  <text x="250" y="49" fill="#4338CA" font-family="system-ui" font-size="10" font-weight="700" text-anchor="middle">Client Frontend</text>
  <text x="250" y="61" fill="#4F46E5" font-family="system-ui" font-size="8" text-anchor="middle">Next.js / React Flow / Three.js</text>

  <!-- Bottom Node: AI Copilot -->
  <rect x="175" y="250" width="150" height="40" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  <text x="250" y="269" fill="#B45309" font-family="system-ui" font-size="10" font-weight="700" text-anchor="middle">Qu-Copilot (RAG)</text>
  <text x="250" y="281" fill="#D97706" font-family="system-ui" font-size="8" text-anchor="middle">Unitary State Grader</text>

  <!-- Left Node: Edge WASM -->
  <rect x="10" y="140" width="150" height="40" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <text x="85" y="159" fill="#047857" font-family="system-ui" font-size="10" font-weight="700" text-anchor="middle">Local WASM Engine</text>
  <text x="85" y="171" fill="#059669" font-family="system-ui" font-size="8" text-anchor="middle">≤16 Qubits • 0ms • Offline</text>

  <!-- Right Node: Cloud Backend -->
  <rect x="340" y="130" width="150" height="60" rx="8" fill="#F8FAFC" stroke="#334155" stroke-width="1.5"/>
  <text x="415" y="149" fill="#0F172A" font-family="system-ui" font-size="10" font-weight="700" text-anchor="middle">Cloud Engine (FastAPI)</text>
  <text x="415" y="161" fill="#475569" font-family="system-ui" font-size="8" text-anchor="middle">Celery / Redis / PostgreSQL</text>
  <text x="415" y="176" fill="#334155" font-family="system-ui" font-size="8" font-weight="700" text-anchor="middle">&gt;16 Qubits / VQE</text>

</svg>
