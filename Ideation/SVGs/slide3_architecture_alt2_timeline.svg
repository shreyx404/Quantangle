<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" width="100%" height="100%">
  <!-- Transparent background for seamless slide integration -->

  <!-- Title -->
  <text x="250" y="30" fill="#0F172A" font-family="system-ui" font-size="12" font-weight="700" text-anchor="middle">Hybrid Execution Timeline</text>

  <!-- Timeline Base Line -->
  <line x1="50" y1="160" x2="450" y2="160" stroke="#CBD5E1" stroke-width="3"/>

  <!-- T = 0ms -->
  <circle cx="80" cy="160" r="6" fill="#4F46E5"/>
  <text x="80" y="140" fill="#4338CA" font-family="system-ui" font-size="10" font-weight="800" text-anchor="middle">T = 0 ms</text>
  <rect x="30" y="180" width="100" height="40" rx="4" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1"/>
  <text x="80" y="198" fill="#4F46E5" font-family="system-ui" font-size="9" font-weight="700" text-anchor="middle">User drops gate</text>
  <text x="80" y="210" fill="#4F46E5" font-family="system-ui" font-size="8" text-anchor="middle">(React Canvas)</text>

  <!-- T = 2ms -->
  <circle cx="180" cy="160" r="6" fill="#0F172A"/>
  <text x="180" y="140" fill="#0F172A" font-family="system-ui" font-size="10" font-weight="800" text-anchor="middle">T = 2 ms</text>
  <rect x="130" y="180" width="100" height="40" rx="4" fill="#F8FAFC" stroke="#0F172A" stroke-width="1"/>
  <text x="180" y="198" fill="#0F172A" font-family="system-ui" font-size="9" font-weight="700" text-anchor="middle">AST Transpiles</text>
  <text x="180" y="210" fill="#475569" font-family="system-ui" font-size="8" text-anchor="middle">to OpenQASM 3.0</text>

  <!-- Split Branching -->
  <path d="M 230,160 Q 255,160 255,100 T 280,100" fill="none" stroke="#059669" stroke-width="2"/>
  <path d="M 230,160 Q 255,160 255,240 T 280,240" fill="none" stroke="#D97706" stroke-width="2" stroke-dasharray="4,4"/>

  <!-- T = 5ms (WASM) -->
  <circle cx="280" cy="100" r="6" fill="#059669"/>
  <text x="280" y="80" fill="#047857" font-family="system-ui" font-size="10" font-weight="800" text-anchor="middle">T = 5 ms</text>
  <rect x="310" y="80" width="130" height="40" rx="4" fill="#ECFDF5" stroke="#059669" stroke-width="1"/>
  <text x="375" y="98" fill="#047857" font-family="system-ui" font-size="9" font-weight="700" text-anchor="middle">Local WASM Render</text>
  <text x="375" y="110" fill="#059669" font-family="system-ui" font-size="8" text-anchor="middle">85% of queries (≤16 Qubits)</text>

  <!-- T = 200ms (Cloud) -->
  <circle cx="280" cy="240" r="6" fill="#D97706"/>
  <text x="280" y="220" fill="#B45309" font-family="system-ui" font-size="10" font-weight="800" text-anchor="middle">T = ~200 ms</text>
  <rect x="310" y="220" width="130" height="40" rx="4" fill="#FFFBEB" stroke="#D97706" stroke-width="1"/>
  <text x="375" y="238" fill="#B45309" font-family="system-ui" font-size="9" font-weight="700" text-anchor="middle">Cloud FastAPI Render</text>
  <text x="375" y="250" fill="#D97706" font-family="system-ui" font-size="8" text-anchor="middle">Heavy workloads (&gt;16, VQE)</text>

</svg>
